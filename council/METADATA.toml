topic_approval_order = "№ 7-D от 27.08.2022"
topic_approval_date = "27.08.2022"
topic_approval_basis_ru = "Представление зав. кафедрой «КИ» Чинибаевой Т.Т., протокол заседания Ученого совета АО «МУИТ» № 2 от 22 октября 2022 г."
topic_approval_scan = "council/orders/2022-08-27_prikaz-7-D_utverzhdenie-temy.pdf"
udc = "004.93:617.735"
