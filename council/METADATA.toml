# -----------------------------------------------------------------------------
# Документ есть у всех 16 образцов защит и готовится на этапе предварительной
# экспертизы. Форма — таблица из 9 строк; строки 1–5 берутся из этого реестра,
# строки 6–9 (объекты исследования и три вердикта о нарушениях) заполняет сама
# комиссия, а не докторант.
#
# ⚠ ПЕРВЫМ РЕШАЕТСЯ НЕ ТЕКСТ, А ОРГАН. Два пути, и они не равнозначны по срокам:
#   1) внутренняя этическая комиссия АО «МУИТ»;
#   2) внешний аккредитованный комитет по биоэтике — так сделано у Базарбекова, и
#      для темы с медицинскими данными именно этот путь встречается в образцах;
#      у него собственный цикл подачи, который надо запускать заранее.
# До выбора органа остальные поля секции заполнить нечем.
#
# НАЙДЕНО 2026-08-16 (не вписано в поля, потому что зависит от выбора органа): если
# идти внутренним путём, то в шести заключениях архива образцов (Науменко, Нәлгожина,
# Мерембаев, Чинибаев, Ибраева, Алпар) орган называется
#   «Этическая комиссия по оценке научных исследований АО «МУИТ»»,
# подписи под ним — председатель Найзабаева Л.К. (она же председатель диссовета) и
# секретарь Есмурзаева А.Б. (она же учёный секретарь АО «МУИТ», см. [organization]).
# То есть по внутреннему пути committee_name_ru / chair_ru / secretary_ru известны
# заранее, а номер и дата заключения — нет. Внешний путь (образец Базарбекова) даёт
# другой орган и другие подписи; у Токтаровой — этическая комиссия своего вуза,
# заключение оформлено протоколом с номером и датой.
