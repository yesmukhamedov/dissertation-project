# Диссертация
# -----------------------------------------------------------------------------
# ✔ ТЕМА СВЕРЕНА С ПРИКАЗОМ 2026-08-24. Источник — выписка из приказа АО «МУИТ»
# № 7-D от 27.08.2022; скан и построчная транскрипция — в council/orders/ (там же
# перечень дефектов печати и список того, что приказ закрывает). До этой даты здесь
# стояла формулировка «про лазерную коагуляцию», принятая со слов кандидата и со
# слайдов, и рядом было записано: пока приказ не сверен, ни одна из ходивших
# формулировок не канонична. Приказ сверен — канонична формулировка про ОКТ и
# заболевания сетчатки; она же значилась здесь третьим, «не используемым» вариантом
# из ранних файлов. Все три языка взяты из приказа, из соответствующих колонок таблицы.
#
# Снятые формулировки — НЕ канонические, в документы совета не идут:
#   «лазерная коагуляция» — RU «Компьютерная система обработки и анализа данных
#     глазного дна для поддержки лазерной коагуляции при лечении диабетической
#     ретинопатии» (+ EN и KZ пары к ней). Держалась 2026-08-14 … 2026-08-24.
#   рабочее название тома — EN «Automated Diabetic Retinopathy Diagnosis via Fundus
#     Image Enhancement and CNN Classification», RU «Автоматизированная диагностика
#     диабетической ретинопатии посредством улучшения изображений глазного дна и
#     классификации с помощью CNN», KZ «Көз түбі кескіндерін жақсарту және CNN арқылы
#     жіктеу негізінде диабеттік ретинопатияны автоматтандырылған диагностикалау».
#     Под ним написан том и собраны текущие .docx/.pdf в defense/docs.
# ⚠ Если после 27.08.2022 выходил приказ об ИЗМЕНЕНИИ темы, он старше приказа № 7-D
#   и отменяет всё сказанное выше. Положить его в council/orders/ и переписать эту
#   секцию по нему. До тех пор канонична выписка № 7-D.
#
# ⚠⚠ РАСХОЖДЕНИЕ ТЕМЫ С СОДЕРЖАНИЕМ ТОМА — после сверки с приказом оно стало ШИРЕ,
# а не уже. Приказ утверждает систему по изображениям ОПТИЧЕСКОЙ КОГЕРЕНТНОЙ
# ТОМОГРАФИИ; том написан и защищается по ЦВЕТНЫМ СНИМКАМ ГЛАЗНОГО ДНА (fundus):
# восемь корпусов — EyePACS, APTOS 2019, IDRiD, Messidor-2, DDR, ODIR-5K, RFMiD и
# клинический набор — ни одного ОКТ-снимка и ни одного эксперимента на ОКТ. Прежнее
# расхождение («лазерная коагуляция» против диагностики ДР) касалось задачи; это
# касается модальности съёмки, то есть самих данных. Оформлением — переписыванием
# аннотаций и отзывов — оно не закрывается: нужен либо приказ об изменении темы под
# содержание тома, либо решение совета. Вопрос будет задан на заседании.
#
# ⚠ ПОСЛЕДСТВИЕ ДЛЯ ГОТОВЫХ ДОКУМЕНТОВ: во всех документах совета, собранных до
#   2026-08-24, стоит снятая формулировка. `check_metadata.py` покажет их строкой
#   «нет канонического значения dissertation.title_*» — это ожидаемо и снимается
#   пересборкой ПОСЛЕ того, как решён вопрос выше, а не до него.
[dissertation]
title_en = "Information system for automatic detection of retinal diseases based on deep learning using optical coherence tomography images"
title_ru = "Информационная система автоматического обнаружения заболеваний сетчатки на основе глубокого обучения с использованием изображений оптической когерентной томографии"
# KZ — форма приказа с ВОССТАНОВЛЕННОЙ орфографией: печатная строка приказа содержит
