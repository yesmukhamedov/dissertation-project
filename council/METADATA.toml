title_kz_order_verbatim = "Оптикалық когерентті томографиялык кескіндерді пайдалана отырып, терендетіп окту негізінде көз торынын ауруларын автоматты түрде анықтаудың ақпараттық жүйесі"
# Приказ об утверждении темы — строка 4 заключения этической комиссии («Тема и дата
# её утверждения»). В приказе номер напечатан как «№7- D», с пробелом внутри номера;
