# =============================================================================
# ЕДИНЫЙ РЕЕСТР МЕТАДАННЫХ ЗАЩИТЫ — single source of truth
# =============================================================================
# Здесь и ТОЛЬКО здесь хранятся: Ф.И.О. и должности всех участников, почта,
# ORCID, название кафедры/факультета/организации, код и название ОП, тема
# диссертации на трёх языках, объём тома, список публикаций, состав диссовета.
#
# Правило: ни один документ (thesis/output/*.md, шаблоны council/, скрипты
# сборки, слайды defense/) НЕ содержит собственной копии этих значений —
# он берёт их отсюда. Если значение изменилось — правится этот файл, затем
# `python .claude/skills/council-docs/scripts/check_metadata.py` показывает,
# где по документам осталась старая форма.
#
# Читается программно: build_title.py (титульный лист) и check_metadata.py.
# Формат — TOML (парсится stdlib-модулем tomllib, зависимостей нет).
#
# Пустая строка "" = значение НЕ УСТАНОВЛЕНО. Список всех пустых полей и того,
# в каком документе каждое понадобится, — в самом низу файла, секция [missing],
# и его же печатает check_metadata.py.
# ⚠ Поле, которого нет в [missing], проверкой НЕ отслеживается. Заводя новое пустое
#   поле, добавляйте строку и туда — иначе оно молча пропадёт из отчёта. Обратное
#   тоже верно: строка в [missing] без такого поля в реестре — ошибка проверки.
# ⚠ Не заполнять догадкой: выдуманное Ф.И.О., адрес или e-mail в документе
# совета — это дефект, который всплывает при рассылке и при сверке с приказом.
# =============================================================================

