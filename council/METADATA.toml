# -----------------------------------------------------------------------------
# Диссертация
# -----------------------------------------------------------------------------
# ⚠⚠ ТЕМА ЗАМЕНЕНА 2026-08-14 по указанию кандидата — на утверждённую формулировку
# «про лазерную коагуляцию». RU и EN даны кандидатом; KZ восстановлен из титульного
# и финального слайдов защиты, где эта же тема стояла до 2026-08-13 (тогда она была
# принята за устаревшую и заменена — теперь возвращена). Кандидат сверяет все три
# языка с ПРИКАЗОМ об утверждении темы и подтвердит формулировки отдельно.
#
# ⚠ РАСХОЖДЕНИЕ ТЕМЫ С СОДЕРЖАНИЕМ ТОМА. Диссертация написана и защищается по
# автоматизированной диагностике ДР: 8-этапный конвейер предобработки как компонент
# модели, CNN-классификация, восемь корпусов. Лазерная коагуляция присутствует в
# работе одним теоретическим блоком (математическое моделирование лазерного
# воздействия на ткани глазного дна, гл. 2) и одной публикацией из пяти (Вестник
# КазУТБ, 2025). Название «компьютерная система … для поддержки лазерной
# коагуляции» описывает не то, что содержит том. Это вопрос не оформления, а
# соответствия темы и содержания — его задаст совет. Решается либо приказом об
# изменении темы, либо тем, что в приказе стоит другая формулировка.
#
# Рабочее название, под которым написан том (238 EN / 265 KZ страниц) и собраны
# все текущие .docx/.pdf в defense/docs:
#   EN «Automated Diabetic Retinopathy Diagnosis via Fundus Image Enhancement and CNN Classification»
#   RU «Автоматизированная диагностика диабетической ретинопатии посредством улучшения
#       изображений глазного дна и классификации с помощью CNN»
#   KZ «Көз түбі кескіндерін жақсарту және CNN арқылы жіктеу негізінде диабеттік
#       ретинопатияны автоматтандырылған диагностикалау»
# Третий найденный вариант (в ранних файлах, НЕ используется):
#   RU «Автоматизированное обнаружение заболеваний сетчатки на основе глубокого
#       обучения с использованием оптически когерентных томографических изображений»
[dissertation]
title_en = "Computer System for Processing and Analysis of Eye Data to Support Laser Coagulation in the Treatment of Diabetic Retinopathy"
title_ru = "Компьютерная система обработки и анализа данных глазного дна для поддержки лазерной коагуляции при лечении диабетической ретинопатии"
title_kz = "Компьютерлік өңдеу жүйесі және көз түбі деректерін талдаумен диабеттік ретинопатияны емдеу кезіндегі лазерлік коагуляцияны қолдау"
# RU-формулировка от кандидата пришла ПРОПИСНЫМИ; здесь хранится в обычном регистре —
# титульный лист и так набирает её капителью, а в тексте отзывов нужен обычный регистр.
# ⚠ KZ-редакция сверки требует особенно: это не дословный перевод RU, а самостоятельная
# формулировка со слайдов («компьютерная система обработки И анализ данных глазного дна» →
# «Компьютерлік өңдеу жүйесі және көз түбі деректерін талдаумен»). Защита на казахском,
# то есть в приказе значима именно она.
# Приказ об утверждении темы — строка 4 заключения этической комиссии («Тема и дата
# её утверждения»). Он же разрешает расхождение темы с содержанием тома, описанное
# выше: пока приказ не сверен, ни одна из трёх формулировок не считается канонической.
# Заполнять с приказа дословно, включая номер и дату.
topic_approval_order = ""
topic_approval_date = ""
udc = "004.93:617.735"
degree_en = "Doctor of Philosophy (PhD)"
degree_ru = "доктор философии (PhD)"
degree_kz = "философия докторы (PhD)"
# Язык защиты; казахское издание — защищаемый том
language = "kz"
year = 2026
# Объём: казахское издание — защищаемый том, поэтому во ВСЕХ трёх аннотациях
# значима именно KZ-цифра.
# ПЕРЕИЗМЕРЕНО по пересобранному тому (экспорт GOST 2026-08-21,
# FULL_DISSERTATION_*_GOST_2026-08-21.docx, счёт страниц через Word). Зонтичный
# заголовок ҚОСЫМШАЛАР/APPENDICES из тома убран (он печатался одиноким словом на
# пустой странице), поэтому приложения открываются сразу «ҚОСЫМША А»/«APPENDIX A»,
# и граница основного текста берётся по началу первого приложения:
#   KZ — всего 158 страниц, «ҚОСЫМША А» на 119 → без приложений 118;
#   EN — всего 146 страниц, «APPENDIX A» на 108 → без приложений 107.
# Заголовок приложения набирается в две строки (обозначение, под ним заголовок) —
# как во всех одиннадцати томах совета, где есть приложения; на границу основного
# текста это не влияет (приложение и так открывает страницу), в KZ прибавилась
# одна страница в самих приложениях: 157 → 158.
# Основной текст вырос на страницу-две против 2026-08-20 (117/105): во введении
# появились ссылки на пять собственных публикаций — их требует п. 5-1 и 6 Правил
# присуждения степеней и позиция 4 комплекта документов в совет, — а список
# источников вырос с 99 до 102.
# Прежние 265/238 относились к снятому с производства шеститомнику; таблицы,
# рисунки и источники — счёт основного текста (гейт thesis/scripts/conformance.py),
# diagrams — четыре структурных вида Приложения C/Б (в основном тексте диаграмм нет).
# Три аннотации и десять отзывов (девять файлов двух официальных рецензентов плюс
# научного руководителя) пересинхронизированы 2026-08-21 по этому тому: 118 с.,
# 19 таблиц, 16 рисунков, четыре схемы, 102 источника, четыре главы.
pages_kz = 118
pages_en = 107
tables = 19
figures = 16
