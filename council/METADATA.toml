# -----------------------------------------------------------------------------
# Образовательная программа
# -----------------------------------------------------------------------------
# ИСПРАВЛЕНО 2026-08-14 по указанию кандидата: 8D06104 → 8D06102.
# Кандидат назвал свою программу «Программной инженерией, как у Иманкуловой Б.Б.
# и Бакировой Г.С.». Проверено по документам самого совета: обе защищаются по
# 8D06102 — извещение о защите Бакировой Г.С. (KZ: «Компьютерлік және
# программалық инженерия») и протокол расширенного заседания кафедры № 17 от
# 29.06.2026 по Иманкуловой Б.Б. (RU: «Компьютерная и программная инженерия»).
# Отдельной докторской ОП «Программная инженерия» в МУИТ нет: под этим именем
# идут бакалавриат 6B06110 и магистратура 7M06101. Кафедра «Компьютерная
# инженерия» ведёт на докторском уровне ровно две программы — 8D06102 и 8D06104.
# Английское имя — со страницы программы на сайте МУИТ.
# ✔ ПОДТВЕРЖДЕНО ДОКУМЕНТАЛЬНО 2026-08-24: выписка из приказа АО «МУИТ» № 7-D от
#   27.08.2022 (скан — council/orders/2022-08-27_prikaz-7-D_utverzhdenie-temy.pdf)
#   ставит кандидата в строке-заголовке «8D06102-«Компьютерная и программная
#   инженерия»». Спор 8D06104 ↔ 8D06102 закрыт; приказ о зачислении для этого
#   больше не нужен. Прежнее значение 8D06104 «Вычислительная техника и
#   программное обеспечение» держалось с 2026-06-12 и попало в 12 документов
#   совета — если где-то ещё осталось, это ошибка (строка в [check.forbidden]).
