# ЧТО ОБЯЗАТЕЛЬНО УТОЧНИТЬ ПРИ ВСТРЕЧЕ (нельзя брать с сайта)
# ═════════════════════════════════════════════════════════════════════════════
#
# organization — только с бланка, буква в букву. Юридическая форма КазНИИ
#   (АО / РГП на ПХВ / ТОО) на сайте института нигде не напечатана, а в
#   документе она должна совпадать с шапкой бланка, на котором печатается отзыв.
#
# fio — формат «Фамилия И. О.», как в блоке подписи. У Үмбетиара в открытых
#   источниках четыре написания: Үмбетиар / Умбетиар / Умбетияр, отчество
#   Бекімұлы / Бекимович. Взять то, которым он подписывается сам, и НЕ
#   «исправлять» под казахскую орфографию.
#
# position / category / degree — подтвердить у самого врача; на сайте они не
#   датированы. Пустое поле просто не печатается, но регалии здесь работают
#   на вес документа, поэтому пустыми оставлять не стоит.
#
# demo_date — формат "2026-09-15". Пока пусто → печатается жёлтый плейсхолдер
#   <дата>, и документ читается как подготовленный к подписи бланк, а не как
#   состоявшийся отзыв. Это намеренно: заполнять только после демонстрации.
#
