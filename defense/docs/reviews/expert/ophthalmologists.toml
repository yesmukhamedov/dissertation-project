# Данные практикующих офтальмологов, давших отзыв на демонстрацию приложения.
#
# Это единственный файл, который правит кандидат. Тексты отзыва лежат в
# template_ru.md (части 1, 2, 4) и voice_*.md (часть 3); сборка —
# `python defense/docs/reviews/expert/build_expert_reviews.py`.
#
# Данные докторанта, тема и образовательная программа сюда НЕ дублируются:
# генератор берёт их из council/METADATA.toml, поэтому дословность реестра
# гарантируется построением.
#
# Пустое значение → в документе печатается плейсхолдер <…>, и бланк остаётся
# пригодным для распечатки и заполнения от руки.

schema_version = 1

# ─────────────────────────────────────────────────────────────────────────────
# ОТЗЫВ 1 — Үмбетиар Алмас Бекімұлы
#
# Заведующий лазерным отделением Казахского НИИ глазных болезней (Алматы,
# ул. Толе би, 95А, уг. Байтурсынова). Панретинальная лазеркоагуляция при
# диабетической ретинопатии — его ежедневная работа, поэтому ему отдан
# вариант `screening`: он видит ровно тот поток «направить / не направить»,
# о котором говорит этот текст.
#
# Практика подтверждена: реестр врачей eyeinst.kz + активная онлайн-запись
# на 103.kz (две карточки), iDoctor.kz, DocOK.kz, medelement. Принимает
# также в Офтальмологическом центре проф. Ботабековой Т. К. (ул. Тулебаева, 4)
# — это запасной бланк и второй способ на него выйти.
# ─────────────────────────────────────────────────────────────────────────────
[[ophthalmologist]]
slug         = "1"                   # имя файлов: expert_review_1_ru.{md,docx,pdf}
fio          = "Үмбетиар А. Б."      # ⚠ сверить с подписью врача, см. примечание ниже
position     = "заведующий лазерным отделением, врач-офтальмолог"
category     = "высшая квалификационная категория"
degree       = "к.м.н."
organization = "ТОО «Казахский ордена «Знак Почета» научно-исследовательский институт глазных болезней»"
                                     # ⚠ юрформа взята из реестров госзакупок/mp.kz (БИН 990240009173);
                                     #   сверить с шапкой бланка — в источниках также АО и РГКП
demo_date    = "2026-08-28"          # демонстрация состоялась
variant      = "screening"           # screening | interpretability
role         = "докторант"           # как врач называет: докторант | соискатель | исследователь

